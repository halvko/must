id = "must"
name = "Must"
version = "0.0.1"
schema_version = 1
authors = ["Erik Funder Carstensen <fundererik@gmail.com>"]
description = "Must language support (dev)"
repository = "https://github.com/halvko/must-lsp-server"

# The grammar is built from `editors/tree-sitter-must` at `rev`, which must
# be a pushed commit and is bumped (here and in editors/helix/languages.toml)
# after every change to the grammar; the queries in `languages/must/` are
# read from this directory, so a stale `rev` shows as an uncolored buffer
# and a query error in the Zed log. To try an unpushed grammar, point
# `repository` at a local checkout (`file:///abs/path/to/must`)
# and `rev` at a commit in it, then reinstall the dev extension.
[grammars.must]
repository = "https://github.com/halvko/must"
rev = "dc73d9496fe57d1487ace30cadf05d179f80e4c2"
path = "editors/tree-sitter-must"

[language_servers.must-lsp]
name = "Must LSP"
languages = ["Must"]

# Schema lives at the default path: debug_adapter_schemas/must.json
[debug_adapters.must]
