[workspace]
resolver = "3"
members = ["crates/*"]
# The Zed extension builds to wasm via Zed's own toolchain.
exclude = ["editors/zed"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# local crates
syntax = { path = "crates/syntax" }
base-db = { path = "crates/base-db" }
hir = { path = "crates/hir" }
mir = { path = "crates/mir" }
ide = { path = "crates/ide" }

# external — salsa pinned: its macro API has churned repeatedly, upgrade deliberately
salsa = "=0.27.0"
rowan = "0.16.1"
text-size = "1.1.1"
ena = "0.14"
rustc-hash = "2"
la-arena = "0.3"
line-index = "0.1.2"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
serde_json = "1.0.150"
crossbeam-channel = "0.5.15"
tracing = "0.1"
tracing-subscriber = "0.3"
expect-test = "1.5"
