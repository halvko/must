# Must support for Helix. Helix has no extension system: append this to
# ~/.config/helix/languages.toml (or `.helix/languages.toml` in a project).
#
# `command` assumes `must-lsp` on PATH (`cargo install --path crates/must-lsp`).
# To dogfood a local build instead, point both `command`s at
# <this repo>/target/debug/must-lsp (absolute path; Helix does not expand
# `~` or resolve relative paths against the workspace).
#
# What Helix gets from the server: diagnostics, hover, goto-definition,
# completions (snippets included), code actions, and the debug adapter.
# What it cannot get: the ▶ run lenses (Helix has no code-lens support).
# Run a file from the shell instead: `must-lsp run path/to/file.must`.
#
# Highlighting comes from the tree-sitter grammar at the bottom of this
# file; Helix has no LSP semantic tokens. It needs Helix 25.07 or later:
# the queries rely on a later pattern winning over an earlier one on the
# same node, and older releases resolve that the other way round. Set up:
#
#   hx --grammar fetch && hx --grammar build
#   mkdir -p ~/.config/helix/runtime/queries
#   ln -s <this repo>/editors/tree-sitter-must/queries \
#       ~/.config/helix/runtime/queries/must
#
# The grammar is built from the pinned `rev`, the queries are read from the
# checkout through that link. After a grammar change both `rev`s (here and
# editors/zed/extension.toml) are bumped to a pushed commit and the grammar
# is rebuilt; until then a query can name a node the built parser lacks,
# which shows as an uncolored buffer and a query error in `hx --log`. To
# use the checkout's grammar directly, replace the source with
# `source = { path = "<this repo>/editors/tree-sitter-must" }` and run
# `hx --grammar build` after every `npm run generate`.

[language-server.must-lsp]
command = "must-lsp"
# Server logs (a `tracing` env-filter) go to Helix's log file (`hx --log`):
# environment = { MUST_LSP_LOG = "must_lsp=debug" }

[[language]]
name = "must"
scope = "source.must"
file-types = ["must"]
comment-tokens = ["//"]
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = ["must-lsp"]
indent = { tab-width = 4, unit = "    " }

# The adapter is the same binary in `dap` mode (it *is* the interpreter, so
# every session is a launch). Start one with `:debug-start` / space-g-l and
# pick a template; breakpoints, stepping, the stack and locals all work, and
# `print` output lands in the debug pane. `absolute-paths` matters: Helix's
# filename completion hands over paths relative to its cwd and the adapter
# takes `program` verbatim.
[language.debugger]
name = "must"
transport = "stdio"
command = "must-lsp"
args = ["dap"]
quirks = { absolute-paths = true }

[[language.debugger.templates]]
name = "run file (main())"
request = "launch"
completion = [{ name = "program", completion = "filename" }]
args = { program = "{0}" }

[[language.debugger.templates]]
name = "run file with entry expression"
request = "launch"
completion = [
  { name = "program", completion = "filename" },
  { name = "entry", default = "main()" },
]
args = { program = "{0}", entry = "{1}" }

[[language.debugger.templates]]
name = "run file, stop on entry"
request = "launch"
completion = [{ name = "program", completion = "filename" }]
args = { program = "{0}", stopOnEntry = true }

# PLACEHOLDER: replace `rev` with the commit that lands the grammar.
[[grammar]]
name = "must"
source = { git = "https://github.com/halvko/must-lsp-server", rev = "0000000000000000000000000000000000000000", subpath = "editors/tree-sitter-must" }
