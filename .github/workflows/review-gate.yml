# Runs .github/scripts/review-gate.sh to set the `review gate` status.
name: Review gate

# GitHub has no event for resolving a thread; see .github/reviewers/README.md.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize, labeled]
  pull_request_review_comment:
    types: [created, deleted]
  workflow_run:
    workflows: [Review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

# Each run reads the PR as it is now, so the newest one is all that matters.
concurrency:
  group: >-
    review-gate-${{ github.event.pull_request.number
    || github.event.workflow_run.pull_requests[0].number || inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    # Fork PRs get no reviewers and a read-only token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0] != null) ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PRS: >-
            ${{ github.event.pull_request.number || inputs.pr
            || join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          for pr in $PRS; do
            PR=$pr .github/scripts/review-gate.sh
          done
