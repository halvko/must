# Claude reviewers on pull requests: one job per role file in .github/reviewers/.
name: Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

# A newer run on the same PR supersedes the running review.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  roles:
    # Drafts are skipped; the `review` label asks for a fresh round on demand.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'review')
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.list.outputs.roles }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          roles=$(find .github/reviewers -maxdepth 1 -name '*.md' ! -name README.md \
            -printf '%f\n' | sed 's/\.md$//' | sort | jq -Rnc '[inputs]')
          echo "roles=$roles" >> "$GITHUB_OUTPUT"

  review:
    needs: roles
    if: needs.roles.outputs.roles != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.roles.outputs.roles) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A brief may open with a `---` front matter block holding `model: <name>`.
      - id: brief
        run: |
          file=".github/reviewers/${{ matrix.role }}.md"
          if [ "$(head -n1 "$file")" = "---" ]; then
            front=$(awk 'NR > 1 && /^---$/ { exit } NR > 1' "$file")
            body=$(awk 'f; NR > 1 && /^---$/ { f = 1 }' "$file")
          else
            front=""
            body=$(cat "$file")
          fi
          model=$(printf '%s\n' "$front" | sed -n 's/^model:[[:space:]]*//p')
          {
            echo "model_arg=${model:+--model $model}"
            echo 'text<<__REVIEWER_BRIEF__'
            printf '%s\n' "$body"
            echo '__REVIEWER_BRIEF__'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            You are the "${{ matrix.role }}" reviewer for this pull request. Other
            reviewers cover other concerns in parallel; stay inside your brief
            below and leave everything else to them.

            Read the diff (`gh pr diff`), the PR description and commit messages
            (`gh pr view`), and as much surrounding code as you need to judge it.
            Report only findings you can point at a line for and would defend to
            the author. No praise, no restating the diff, no style nits your brief
            does not ask for. If you find nothing, say so in one line.

            Before judging, read the discussion the PR already has: comments and
            reviews (`gh pr view --comments`) and inline review threads, with
            exactly `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
            (flags after the path; use `--jq`, not a pipe). A point the author
            or a maintainer has already settled in a reply there (asked for,
            accepted, or declined with a reason) is not a finding, unless the
            code has changed since in a way that reopens it. Do not repeat a
            finding an earlier review round already posted; if it is still
            unaddressed, list it once in your summary as still open, with no new
            inline comment.

            Post each finding as an inline comment on the line it concerns, with
            mcp__github_inline_comment__create_inline_comment and
            `confirmed: true`, opening with
            `**${{ matrix.role }}:**`. Then post one summary comment with
            `gh pr comment`, headed `### ${{ matrix.role }} review`, listing the
            findings in a sentence each (or saying there are none).

            Your brief:

            ${{ steps.brief.outputs.text }}
          claude_args: |
            ${{ steps.brief.outputs.model_arg }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*)"

  # Takes the `review` label off once the round ends, so adding it again asks for another.
  unlabel:
    needs: [roles, review]
    # Fork PRs get a read-only token, so their label stays.
    if: >-
      always() && needs.roles.result == 'success' &&
      contains(github.event.pull_request.labels.*.name, 'review') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --remove-label review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
