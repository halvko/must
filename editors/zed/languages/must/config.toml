name = "Must"
path_suffixes = ["must"]
line_comments = ["// "]
# Four-key shape per Zed's `BlockCommentConfig` (the bundled HTML extension
# is the precedent); `prefix`/`tab_size` left at their no-op defaults since
# Must has no continuation-formatting convention for a multi-line comment.
block_comment = { start = "/*", end = "*/", prefix = "", tab_size = 0 }
# The tree-sitter grammar (`[grammars.must]` in extension.toml) colors the
# buffer through `highlights.scm`, which is generated from
# editors/tree-sitter-must/queries/highlights.scm; the server's semantic
# tokens refine it (`semantic_tokens: "combined"` in the README).
# Deliberately no `indents.scm`: the server's multi-line completion
# snippets carry absolute indentation, which is right only while Zed has no
# indents query to re-indent them with.
grammar = "must"

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    # Auto-close is a separate mechanism from `block_comment` above (that one
    # drives the comment-toggle command and continuation formatting, not
    # typing): typing `/*` inserts ` */` right after the cursor, giving
    # `/* | */` to type into. `not_in` here follows the `"` entry just above.
    { start = "/*", end = " */", close = true, newline = false, not_in = ["string", "comment"] },
]
