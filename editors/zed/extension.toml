id = "must"
name = "Must"
version = "0.0.1"
schema_version = 1
authors = ["Erik Funder Carstensen <fundererik@gmail.com>"]
description = "Must language support (dev)"
repository = "https://github.com/halvko/must-lsp-server"

# The grammar is built from `editors/tree-sitter-must` at `rev`, the commit of
# the grammar sources (.github/scripts/grammar-pin.sh). The queries come from
# `languages/must/`, so a stale `rev` shows as an uncolored buffer and a query
# error in the Zed log. To try an unpushed grammar, point `repository` at a
# local checkout (`file:///abs/path/to/must`) and `rev` at a commit in it.
[grammars.must]
repository = "https://github.com/halvko/must"
rev = "8e528117ed7ec53f6ed50d8109d6533d1ddfd43a"
path = "editors/tree-sitter-must"

[language_servers.must-lsp]
name = "Must LSP"
languages = ["Must"]

# Schema lives at the default path: debug_adapter_schemas/must.json
[debug_adapters.must]
